spring.application.name=nightcart-simple-fourdb
server.port=${PORT:8080}
spring.thymeleaf.cache=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nightcart?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
monetdb.enabled=${MONETDB_ENABLED:false}
monetdb.url=${MONETDB_URL:jdbc:monetdb://localhost:50000/demo}
monetdb.username=${MONETDB_USERNAME:monetdb}
monetdb.password=${MONETDB_PASSWORD:monetdb}
neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
neo4j.username=${NEO4J_USERNAME:neo4j}
neo4j.password=${NEO4J_PASSWORD:shoppingcart123}
