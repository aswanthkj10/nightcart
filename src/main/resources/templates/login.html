<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · NightCart</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand auth-brand" th:href="@{/login}"><span class="brand-mark">N</span><span><b>NightCart</b><small>WELCOME BACK</small></span></a>
    <h1>Sign in</h1>
    <p class="auth-subtitle">Continue to your account.</p>
    <div class="flash success" th:if="${param.registered}">Your account is ready. Sign in to continue.</div>
    <div class="flash success" th:if="${param.logout}">You have been signed out.</div>
    <div class="flash error" th:if="${param.error}">Incorrect username or password.</div>
    <form method="post" th:action="@{/login}" class="auth-form">
      <label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button auth-submit" type="submit">Sign in</button>
    </form>
    <p class="auth-switch">New to NightCart? <a th:href="@{/register}">Create an account</a></p>
  </main>
</body></html>
