services:
  redis:
    image: redis:7-alpine
    container_name: nightcart-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
  mongodb:
    image: mongo:7
    container_name: nightcart-mongodb
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
    restart: unless-stopped
  neo4j:
    image: neo4j:5
    container_name: nightcart-neo4j
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/shoppingcart123
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes: ["neo4j_data:/data"]
    restart: unless-stopped
  monetdb:
    image: monetdb/monetdb:latest
    container_name: nightcart-monetdb
    ports: ["50000:50000"]
    environment:
      MDB_DB_ADMIN_PASS: "monetdb"
      MDB_CREATE_DBS: "demo"
    volumes: ["monetdb_data:/var/monetdb5/dbfarm"]
    restart: unless-stopped
volumes:
  redis_data:
  mongo_data:
  neo4j_data:
  monetdb_data:
