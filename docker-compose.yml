services:
  app:
    build: .
    container_name: nightcart-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://mongodb:27017/nightcart?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      MONETDB_URL: jdbc:monetdb://monetdb:50000/demo
      MONETDB_USERNAME: monetdb
      MONETDB_PASSWORD: ${MONETDB_PASSWORD:?Set MONETDB_PASSWORD in .env}
    depends_on:
      - redis
      - mongodb
      - neo4j
      - monetdb

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo_data:/data/db"]

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes: ["neo4j_data:/data"]

  monetdb:
    # Official monetdb/monetdb tags currently publish linux/amd64; on an ARM VPS
    # Docker may need amd64 emulation, which can be slower and is not guaranteed.
    platform: linux/amd64
    image: monetdb/monetdb:latest
    restart: unless-stopped
    environment:
      MDB_DB_ADMIN_PASS: ${MONETDB_PASSWORD:?Set MONETDB_PASSWORD in .env}
      MDB_CREATE_DBS: demo
    volumes: ["monetdb_data:/var/monetdb5/dbfarm"]

volumes:
  redis_data:
  mongo_data:
  neo4j_data:
  monetdb_data:
